<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Harambe Escape — Jungle Brawl</title>
<meta name="description" content="Single-player arcade beat-'em-up. Alternate universe: Harambe escapes the Cincinnati Zoo and brawls his way to the jungle.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540" aria-label="Harambe Escape game"></canvas>
  <div id="touch" aria-hidden="true">
    <div id="zone"></div>
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button data-btn="atk" class="b at">ATTACK</button>
      <button data-btn="jump" class="b jp">JUMP</button>
      <button data-btn="heavy" class="b hv">HEAVY</button>
      <button data-btn="special" class="b sp">SPECIAL</button>
    </div>
    <button data-btn="mute" class="b small mute" id="muteBtn">&#9834;</button>
    <button data-btn="start" class="b small pause">II</button>
  </div>
</div>
<p id="help">Move: WASD / arrows · Light: J · Heavy: K · Jump: Space · Special: L (costs a little health) · Pause: Enter · Mute: M</p>
<noscript>This game needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
